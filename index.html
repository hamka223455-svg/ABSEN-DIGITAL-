<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absen Digital SMP 8 Tarakan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Gaya bersama halaman absen dan admin */
:root {
  --navy: #17456d;
  --navy-deep: #0d2740;
  --gold: #f5c400;
  --red: #c4232d;
  --purple: #4a2b8f;
  --ok: #1f9d55;
  --bad: #d64545;
  --warn: #e8a200;
  --bg: #f2f5f9;
  --card: #ffffff;
  --ink: #122033;
  --muted: #5b6a7c;
  --line: #d9e1eb;
  --soft: #e9eff6;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
h1, h2, h3 { text-wrap: balance; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 18px;
  border: 0; border-radius: 10px;
  background: var(--navy); color: #fff;
  font-weight: 700; cursor: pointer;
  transition: filter .15s, transform .05s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn:focus-visible, .iconbtn:focus-visible, .choice:focus-visible, .pill:focus-visible, .dot:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 2px;
}
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn.gold { background: var(--gold); color: #2a2100; }
.btn.ghost { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }
.btn.danger { background: var(--bad); }

.logos {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, .93);
  box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
}
.logos img { height: 38px; width: auto; display: block; }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 300;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: min(92vw, 520px);
  padding: 12px 18px; border-radius: 12px;
  background: #0d2740; color: #fff; font-weight: 600; text-align: center;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Layar masuk */
.gate {
  position: fixed; inset: 0; z-index: 200;
  display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at 20% 0%, #1b5a8f 0%, transparent 55%), linear-gradient(160deg, #0d2740, #07131f);
}
.gate-box {
  width: min(380px, 100%);
  display: flex; flex-direction: column; gap: 12px;
  padding: 26px; border-radius: 20px;
  background: #fff; color: var(--ink);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
}
.gate-logos { display: flex; justify-content: center; gap: 8px; }
.gate-logos img { height: 46px; width: auto; }
.gate-box h2 { margin: 4px 0 0; text-align: center; font-size: 22px; }
.gate-sub { margin: -6px 0 4px; text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.gate-box label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }
.gate-box input {
  height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: #fff; color: var(--ink);
}
.gate-box input:focus { outline: 3px solid #f5c40066; border-color: var(--gold); }
.gate-err { min-height: 18px; margin: 0; color: var(--bad); font-size: 13px; font-weight: 600; }

</style>
<style>
  html, body { overflow: hidden; background: #07131f; color: #fff; }

  /* Bilah atas: logo kiri, judul tengah, tombol kanan */
  .top {
    position: fixed; inset: 0 0 auto 0; z-index: 30; height: 66px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
    background: linear-gradient(#07131fe6, #07131f00);
  }
  .top h1 {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    margin: 0; white-space: nowrap;
    font-size: clamp(15px, 2.6vw, 26px); font-weight: 800; letter-spacing: .16em;
    text-shadow: 0 1px 10px #000b;
  }
  .tools { display: flex; align-items: center; gap: 8px; }
  .iconbtn {
    width: 44px; height: 44px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid #ffffff40; background: #ffffff24; color: #fff;
    cursor: pointer; text-decoration: none; backdrop-filter: blur(6px);
  }
  .iconbtn:hover { background: #ffffff3d; }
  .badge-local { padding: 4px 10px; border-radius: 999px; background: var(--warn); color: #2a1d00; font-size: 12px; font-weight: 700; }

  /* Layar awal */
  #home {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 72px 20px 20px;
    background:
      radial-gradient(ellipse at 18% 0%, #1b5a8f 0%, transparent 55%),
      radial-gradient(ellipse at 90% 100%, #4a2b8f55 0%, transparent 50%),
      linear-gradient(160deg, #0d2740, #07131f);
  }
  .clock { text-align: center; line-height: 1.1; }
  #clkT { font-size: clamp(34px, 8vh, 58px); font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  #clkD { margin-top: 4px; color: #b9c8d8; font-size: 14px; font-weight: 600; }
  .choices { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .choice {
    width: min(310px, 42vw); min-height: min(200px, 46vh); padding: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
    border-radius: 22px; border: 1.5px solid #ffffff33; background: #ffffff14; color: #fff; cursor: pointer;
    backdrop-filter: blur(8px); transition: border-color .15s, background .15s, transform .1s;
  }
  .choice:hover { border-color: var(--gold); background: #ffffff22; transform: translateY(-2px); }
  .choice svg { color: var(--gold); width: clamp(40px, 9vh, 58px); height: auto; }
  .choice b { font-size: clamp(16px, 2.6vw, 21px); }
  .choice span { color: #b9c8d8; font-size: 13px; }

  .sesi {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
    background: #0008; border: 1px solid #ffffff2e; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px);
  }
  .sd { width: 10px; height: 10px; border-radius: 50%; background: #8a98a8; flex: none; }
  .sd.ok { background: #3ddc84; } .sd.bad { background: #ff6b6b; }

  /* Layar kamera */
  #scan { position: fixed; inset: 0; background: #000; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cam.mirror { transform: scaleX(-1); }
  .guide {
    position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%);
    width: min(60vh, 70vw); aspect-ratio: 1; max-width: 100%;
    border: 3px dashed #fff; border-radius: 24px; pointer-events: none;
    box-shadow: 0 0 0 100vmax #00000052; transition: border-color .2s;
  }
  .guide.ok { border-color: #3ddc84; border-style: solid; }
  #scan .sesi { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 72px; }
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background: linear-gradient(#0000, #000b);
  }
  .pill {
    min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #ffffff4d; background: #ffffff26; color: #fff;
    font-weight: 700; cursor: pointer; backdrop-filter: blur(6px); white-space: nowrap;
  }
  .pill:hover { background: #ffffff40; }
  .hint { flex: 1; text-align: center; font-weight: 700; font-size: clamp(13px, 2vw, 17px); text-shadow: 0 1px 8px #000; }
  .hint.bad { color: #ffb4b4; }

  .result {
    position: absolute; right: max(16px, env(safe-area-inset-right)); top: 54%; transform: translateY(-50%);
    width: min(290px, 36vw); padding: 16px; display: flex; gap: 12px; align-items: center;
    border-radius: 18px; background: #fff; color: var(--ink); border-left: 8px solid var(--ok);
    box-shadow: 0 14px 40px #000a; animation: pop .22s ease-out;
  }
  .result.info { border-left-color: #2b7fd1; }
  .result.warn { border-left-color: var(--warn); }
  .result img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--soft); flex: none; }
  .result > div { min-width: 0; display: flex; flex-direction: column; }
  .result small { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: var(--ok); }
  .result.info small { color: #2b7fd1; } .result.warn small { color: #a86f00; }
  .result b { font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
  .result span { color: var(--muted); font-size: 13px; }
  .result p { margin: 6px 0 0; font-size: 13px; font-weight: 700; }
  @keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(.94); } to { opacity: 1; transform: translateY(-50%) scale(1); } }

  .camerr {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: min(420px, 90vw); padding: 20px; border-radius: 18px; background: #fff; color: var(--ink); text-align: center;
  }
  .camerr b { font-size: 18px; } .camerr p { margin: 8px 0 0; color: var(--muted); }

  .rotate {
    display: none; position: fixed; z-index: 40; left: 50%; top: 74px; transform: translateX(-50%);
    padding: 8px 14px; border-radius: 999px; background: var(--gold); color: #2a2100; font-weight: 700; font-size: 13px; white-space: nowrap;
  }
  @media (orientation: portrait) { .rotate { display: block; } }
  @media (prefers-reduced-motion: reduce) { .result { animation: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="logos" id="logos"></div>
  <h1>SMP 8 TARAKAN</h1>
  <div class="tools">
    <span class="badge-local" id="localBadge" hidden>Mode lokal</span>
    <button class="iconbtn" id="btnFs" type="button" aria-label="Layar penuh" title="Layar penuh">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <a class="iconbtn" href="admin.html" aria-label="Buka halaman admin" title="Admin">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><path d="M16 8h2.5a.5.5 0 0 1 .5.5V21"/><circle cx="12.6" cy="12.5" r=".9" fill="currentColor"/></svg>
    </a>
  </div>
</header>

<div class="rotate">Putar perangkat ke posisi landscape</div>

<main id="home">
  <div class="clock"><div id="clkT">--:--</div><div id="clkD"></div></div>
  <div class="choices">
    <button class="choice" id="bFace" type="button">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V9a3 3 0 0 1 3-3h7M32 6h7a3 3 0 0 1 3 3v7M42 32v7a3 3 0 0 1-3 3h-7M16 42H9a3 3 0 0 1-3-3v-7"/><circle cx="24" cy="20" r="6.5"/><path d="M12.5 37c1.6-5.6 6.4-8.5 11.5-8.5S33.900 31.400 35.500 37"/></svg>
      <b>Absen dengan Wajah</b><span>Perlihatkan wajah ke kamera</span>
    </button>
    <button class="choice" id="bQr" type="button">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="14" height="14" rx="2"/><rect x="28" y="6" width="14" height="14" rx="2"/><rect x="6" y="28" width="14" height="14" rx="2"/><path d="M28 28h5v5h-5zM38 28h4M28 38h4M37 37h5v5h-5z"/></svg>
      <b>Absen dengan Barcode Data</b><span>Tunjukkan barcode ke kamera</span>
    </button>
  </div>
  <div class="sesi" id="sesiHome"></div>
</main>

<section id="scan" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <div class="guide" id="guide"></div>
  <div class="sesi" id="sesiScan"></div>
  <div class="result" id="result" hidden>
    <img id="rPhoto" alt="">
    <div><small id="rTitle"></small><b id="rName"></b><span id="rKelas"></span><p id="rMsg"></p></div>
  </div>
  <div class="camerr" id="camErr" hidden><b id="ceT"></b><p id="ceM"></p></div>
  <div class="bottom">
    <button class="pill" id="bBack" type="button">&larr; Kembali</button>
    <div class="hint" id="hint"></div>
    <button class="pill" id="bFlip" type="button">Balik kamera</button>
  </div>
</section>

  const subs = {};
  const fire = c => (subs[c] || []).forEach(f => f());
  const lread = c => { try { return JSON.parse(localStorage.getItem(LS + c)) || {}; } catch (e) { return {}; } };
  const lwrite = (c, o) => { localStorage.setItem(LS + c, JSON.stringify(o)); fire(c); };
  window.addEventListener('storage', e => { if (e.key && e.key.indexOf(LS) === 0) fire(e.key.slice(LS.length)); });

  S.newId = () => (useFb ? db.ref(ROOT).push().key : rid());

  /* where = { child: 'sesiId', equals: 'abc' } (opsional) */
  S.watch = (coll, cb, where) => {
    if (useFb) {
      let ref = db.ref(ROOT + '/' + coll);
      if (where) ref = ref.orderByChild(where.child).equalTo(where.equals);
      const h = ref.on('value', s => cb(toList(s.val())), err => S.onError(err));
      return () => ref.off('value', h);
    }
    const run = () => {
      let l = toList(lread(coll));
      if (where) l = l.filter(x => x[where.child] === where.equals);
      cb(l);
    };
    (subs[coll] = subs[coll] || []).push(run);
    run();
    return () => { subs[coll] = subs[coll].filter(f => f !== run); };
  };

  S.get = async (coll, id) => {
    if (useFb) return (await db.ref(ROOT + '/' + coll + '/' + id).once('value')).val();
    return lread(coll)[id] || null;
  };
  S.put = async (coll, id, data) => {
    if (useFb) return db.ref(ROOT + '/' + coll + '/' + id).set(data);
    const o = lread(coll); o[id] = data; lwrite(coll, o);
  };
  S.remove = async (coll, id) => {
    if (useFb) return db.ref(ROOT + '/' + coll + '/' + id).remove();
    const o = lread(coll); delete o[id]; lwrite(coll, o);
  };
  S.removeMany = async (coll, ids) => {
    if (!ids.length) return;
    if (useFb) return Promise.all(ids.map(i => db.ref(ROOT + '/' + coll + '/' + i).remove()));
    const o = lread(coll); ids.forEach(i => { delete o[i]; }); lwrite(coll, o);
  };

  /* ---------- pemberitahuan singkat ---------- */
  S.toast = msg => {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(S._tt); S._tt = setTimeout(() => t.classList.remove('show'), 3600);
  };

  /* ---------- masuk (login) ---------- */
  const authMsg = e => {
    const c = (e && e.code) || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Email atau kata sandi salah.';
    if (c === 'auth/too-many-requests') return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
    if (c === 'auth/network-request-failed') return 'Tidak ada koneksi internet.';
    if (c === 'auth/operation-not-allowed') return 'Login Email/Password belum diaktifkan di Firebase.';
    return (e && e.message) || 'Gagal masuk.';
  };

  /* role: 'admin' atau 'absen'. Resolve setelah berhasil masuk. */
  S.gate = role => new Promise(resolve => {
    const isAdmin = role === 'admin';
    const adminEmail = (cfg.ADMIN_EMAIL || '').toLowerCase();
    const el = document.createElement('div');
    el.className = 'gate'; el.hidden = true;
    const logos = window.LOGOS ? ['osis', 'smp8', 'mpk'].map(k => '<img src="' + LOGOS[k] + '" alt="">').join('') : '';
    el.innerHTML =
      '<form class="gate-box">' +
      '<div class="gate-logos">' + logos + '</div>' +
      '<h2>' + (isAdmin ? 'Masuk Admin' : 'Masuk Petugas Absen') + '</h2>' +
      '<p class="gate-sub">SMP 8 Tarakan</p>' +
      (useFb ? '<label>Email<input id="gEmail" type="email" required autocomplete="username"></label>' : '') +
      '<label>Kata sandi<input id="gPass" type="password" required autocomplete="current-password"></label>' +
      '<p class="gate-err" id="gErr" role="alert"></p>' +
      '<button class="btn" type="submit">Masuk</button></form>';
    document.body.appendChild(el);
    const form = el.querySelector('form');
    const err = m => { el.querySelector('#gErr').textContent = m || ''; };

    if (!useFb) {
      if (!isAdmin) { resolve(null); return; }
      let ok = false;
      try { ok = sessionStorage.getItem('absen8:adm') === '1'; } catch (e) { /* abaikan */ }
      if (ok) { resolve(null); return; }
      el.hidden = false;
      form.onsubmit = ev => {
        ev.preventDefault();
        if (el.querySelector('#gPass').value === (cfg.LOCAL_ADMIN_PASSWORD || 'admin123')) {
          try { sessionStorage.setItem('absen8:adm', '1'); } catch (e) { /* abaikan */ }
          el.hidden = true; resolve(null);
        } else err('Kata sandi salah.');
      };
      return;
    }

    auth.onAuthStateChanged(u => {
      if (u && (!isAdmin || (u.email || '').toLowerCase() === adminEmail)) {
        el.hidden = true; resolve(u);
      } else {
        err(u ? 'Akun ini bukan akun admin. Masuk dengan akun admin.' : '');
        el.hidden = false;
      }
    });
    form.onsubmit = async ev => {
      ev.preventDefault(); err('');
      try {
        await auth.signInWithEmailAndPassword(el.querySelector('#gEmail').value.trim(), el.querySelector('#gPass').value);
      } catch (e) { err(authMsg(e)); }
    };
  });

  S.signOut = async () => {
    if (useFb) await auth.signOut();
    else { try { sessionStorage.removeItem('absen8:adm'); } catch (e) { /* abaikan */ } }
  };

  return S;
})();

</script>
<script>
/* Pengenal wajah (face-api.js). Model dimuat dari CDN saat pertama dipakai. */
const Face = (() => {
  const MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
  let loading = null;
  return {
    load() {
      if (!window.faceapi) return Promise.reject(new Error('Pustaka wajah gagal dimuat. Periksa koneksi internet.'));
      if (!loading) {
        loading = Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODELS),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)
        ]).catch(e => { loading = null; throw e; });
      }
      return loading;
    },
    opts(threshold) {
      return new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: threshold || 0.5 });
    },
    dist(a, b) {
      let s = 0;
      for (let i = 0; i < 128; i++) { const t = a[i] - b[i]; s += t * t; }
      return Math.sqrt(s);
    },
    parse(str) { return Float32Array.from(String(str).split(',').map(Number)); },
    stringify(desc) { return Array.from(desc).map(v => +v.toFixed(4)).join(','); }
  };
})();

</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const parseYmd = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
  const fmtLong = s => parseYmd(s).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const cfg = window.APP_CONFIG || {};

  $('#logos').innerHTML = ['osis', 'smp8', 'mpk'].map(k => '<img src="' + LOGOS[k] + '" alt="Logo ' + k.toUpperCase() + '">').join('');
  if (Store.mode === 'local') $('#localBadge').hidden = false;

  /* ---------- data ---------- */
  let parts = [], sessions = [], attendance = [], matcher = [];
  let attSes = null, unAtt = null;

  const todaySession = () => sessions.find(s => s.tanggal === ymd(new Date())) || null;

  function syncAttendance() {
    const s = todaySession(), id = s ? s.id : null;
    if (id === attSes) return;
    if (unAtt) { unAtt(); unAtt = null; }
    attSes = id; attendance = [];
    if (id) unAtt = Store.watch('kehadiran', l => { attendance = l; updateInfo(); }, { child: 'sesiId', equals: id });
  }

  function updateInfo() {
    const s = todaySession();
    let dot = 'off', txt = 'Belum ada sesi absen hari ini';
    if (s) {
      const closed = hm(new Date()) > s.batas;
      dot = closed ? 'bad' : 'ok';
      txt = fmtLong(s.tanggal) + ' · ' + (closed ? 'ditutup pukul ' : 'batas pukul ') + s.batas + ' · Hadir ' + attendance.length + '/' + parts.length;
    }
    document.querySelectorAll('.sesi').forEach(el => { el.innerHTML = '<i class="sd ' + dot + '"></i><span></span>'; el.lastChild.textContent = txt; });
  }

  function tickClock() {
    const d = new Date();
    $('#clkT').textContent = hm(d);
    $('#clkD').textContent = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  /* ---------- kamera ---------- */
  const cam = $('#cam');
  let mode = null, stream = null, facing = 'user', loopId = 0, busy = false, wake = null, ac = null;

  async function startCam() {
    stopCam();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('insecure');
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    cam.srcObject = stream;
    await cam.play();
    const f = stream.getVideoTracks()[0].getSettings().facingMode;
    cam.classList.toggle('mirror', mode === 'face' && f !== 'environment');
  }
  function stopCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; cam.srcObject = null;
  }

  function beep(ok) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = ok ? 880 : 320; g.gain.value = .08;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + (ok ? .16 : .24));
    } catch (e) { /* tanpa suara */ }
  }

  function setHint(t, bad) { const h = $('#hint'); h.textContent = t; h.classList.toggle('bad', !!bad); }
  const defaultHint = () => (mode === 'face' ? 'Hadapkan wajah ke dalam kotak' : 'Arahkan barcode ke dalam kotak');

  function showCamError(e) {
    const insecure = e && (e.message === 'insecure' || (!window.isSecureContext));
    $('#ceT').textContent = insecure ? 'Kamera butuh koneksi aman' : 'Kamera tidak bisa dibuka';
    $('#ceM').textContent = insecure
      ? 'Buka halaman ini lewat alamat https:// (hasil hosting) atau localhost.'
      : 'Izinkan akses kamera untuk situs ini di pengaturan browser, lalu coba lagi.';
    $('#camErr').hidden = false;
  }

  async function openScan(m) {
    mode = m; busy = false;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { /* abaikan */ }
    $('#home').hidden = true; $('#scan').hidden = false; $('#camErr').hidden = true; hideResult();
    setHint(m === 'face' ? 'Memuat pengenal wajah…' : defaultHint());
    try { await startCam(); } catch (e) { showCamError(e); setHint(''); return; }
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) { /* abaikan */ }
    const id = ++loopId;
    if (m === 'face') {
      try { await Face.load(); } catch (e) { setHint('Pengenal wajah gagal dimuat. Periksa internet lalu coba lagi.', true); return; }
      if (id !== loopId) return;
      setHint(defaultHint());
      faceLoop(id);
    } else qrLoop(id);
  }

  function closeScan() {
    loopId++; stopCam(); mode = null; busy = false; hideResult();
    if (wake) { try { wake.release(); } catch (e) { /* abaikan */ } wake = null; }
    $('#scan').hidden = true; $('#home').hidden = false;
  }

  /* ---------- hasil ---------- */
  function showResult(p, res) {
    const el = $('#result');
    el.className = 'result ' + res.t;
    $('#rPhoto').src = p.foto || '';
    $('#rName').textContent = p.nama;
    $('#rKelas').textContent = 'Kelas ' + p.kelas;
    $('#rMsg').textContent = res.msg;
    $('#rTitle').textContent = { ok: 'Berhasil', info: 'Sudah tercatat', warn: 'Belum bisa absen' }[res.t];
    $('#guide').classList.toggle('ok', res.t === 'ok');
    el.hidden = false;
  }
  function hideResult() { $('#result').hidden = true; $('#guide').classList.remove('ok'); }

  async function handle(p, method) {
    busy = true;
    const now = new Date(), ses = todaySession();
    let res;
    try {
      if (!ses) res = { t: 'warn', msg: 'Tidak ada sesi absen hari ini.' };
      else {
        const key = ses.id + '_' + p.id;
        const ex = await Store.get('kehadiran', key);
        if (ex) res = { t: 'info', msg: 'Sudah absen pukul ' + (ex.jam || '-') + '.' };
        else if (hm(now) > ses.batas) res = { t: 'warn', msg: 'Absen ditutup pukul ' + ses.batas + '. Hubungi admin.' };
        else {
          await Store.put('kehadiran', key, { sesiId: ses.id, pesertaId: p.id, jam: hm(now), metode: method, manual: false, ts: Date.now() });
          res = { t: 'ok', msg: 'Hadir pukul ' + hm(now) + '.' };
        }
      }
    } catch (e) { res = { t: 'warn', msg: 'Gagal menyimpan. Periksa koneksi lalu ulangi.' }; }
    beep(res.t === 'ok');
    showResult(p, res);
    await sleep(res.t === 'ok' ? 3000 : 3600);
    hideResult(); busy = false;
  }

  /* ---------- absen wajah ---------- */
  function bestMatch(desc) {
    let b = 1e9, b2 = 1e9, bid = null;
    for (const m of matcher) {
      const d = Face.dist(desc, m.d);
      if (d < b) { b2 = b; b = d; bid = m.id; } else if (d < b2) b2 = d;
    }
    if (bid && b < (cfg.FACE_THRESHOLD || 0.5) && (b2 - b > 0.03)) return bid;
    return null;
  }

  async function faceLoop(id) {
    let streak = { id: null, n: 0 };
    while (id === loopId) {
      if (busy || cam.readyState < 2 || !cam.videoWidth) { await sleep(200); continue; }
      const t0 = performance.now();
      let det = null;
      try { det = await faceapi.detectSingleFace(cam, Face.opts(0.5)).withFaceLandmarks(true).withFaceDescriptor(); }
      catch (e) { await sleep(400); continue; }
      if (id !== loopId) return;
      const tall = det ? det.detection.box.height / det.detection.imageDims.height : 0;
      if (!det || det.detection.score < 0.6 || tall < 0.2) {
        streak = { id: null, n: 0 };
        setHint(det ? 'Dekatkan wajah ke kamera' : defaultHint());
      } else {
        const mid = bestMatch(det.descriptor);
        if (!mid) { streak = { id: null, n: 0 }; setHint('Wajah belum dikenali. Coba lebih dekat atau pakai barcode.', true); }
        else {
          streak = streak.id === mid ? { id: mid, n: streak.n + 1 } : { id: mid, n: 1 };
          setHint('Mengenali wajah…');
          if (streak.n >= 3) {
            const p = parts.find(x => x.id === mid);
            streak = { id: null, n: 0 };
            if (p) { await handle(p, 'wajah'); setHint(defaultHint()); }
          }
        }
      }
      await sleep(Math.max(40, 170 - (performance.now() - t0)));
    }
  }

  /* ---------- absen barcode ---------- */
  async function qrLoop(id) {
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
    let lastBad = 0;
    while (id === loopId) {
      if (busy || cam.readyState < 2 || !cam.videoWidth) { await sleep(150); continue; }
      const s = Math.min(1, 720 / cam.videoWidth);
      c.width = Math.round(cam.videoWidth * s); c.height = Math.round(cam.videoHeight * s);
      x.drawImage(cam, 0, 0, c.width, c.height);
      const img = x.getImageData(0, 0, c.width, c.height);
      const code = window.jsQR ? jsQR(img.data, c.width, c.height, { inversionAttempts: 'dontInvert' }) : null;
      if (code && code.data) {
        if (code.data.indexOf('SMP8:') === 0) {
          const p = parts.find(q => q.id === code.data.slice(5));
          if (p) { await handle(p, 'barcode'); setHint(defaultHint()); }
          else if (Date.now() - lastBad > 2000) { lastBad = Date.now(); setHint('Barcode tidak terdaftar', true); setTimeout(() => setHint(defaultHint()), 1800); }
        } else if (Date.now() - lastBad > 2000) {
          lastBad = Date.now(); setHint('Bukan barcode absen SMP 8', true); setTimeout(() => setHint(defaultHint()), 1800);
        }
      }
      await sleep(110);
    }
  }

  /* ---------- tombol ---------- */
  $('#bFace').onclick = () => openScan('face');
  $('#bQr').onclick = () => openScan('qr');
  $('#bBack').onclick = closeScan;
  $('#bFlip').onclick = async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    try { await startCam(); } catch (e) { showCamError(e); }
  };
  $('#btnFs').onclick = async () => {
    const d = document, el = d.documentElement;
    try {
      if (!d.fullscreenElement && !d.webkitFullscreenElement) {
        await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        try { await screen.orientation.lock('landscape'); } catch (e) { /* tidak didukung */ }
      } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } catch (e) { Store.toast('Layar penuh tidak didukung di perangkat ini.'); }
  };

  /* ---------- mulai ---------- */
  tickClock(); setInterval(tickClock, 1000);
  updateInfo();
  Store.gate('absen').then(() => {
    Store.onError = e => Store.toast('Gagal terhubung ke database: ' + (e.message || e));
    Store.watch('peserta', l => {
      parts = l;
      matcher = l.filter(p => p.desc).map(p => ({ id: p.id, d: Face.parse(p.desc) }));
      updateInfo();
    });
    Store.watch('sesi', l => { sessions = l; syncAttendance(); updateInfo(); });
    setInterval(() => { syncAttendance(); updateInfo(); }, 30000);
    Face.load().catch(() => { /* dicoba lagi saat tombol wajah ditekan */ });
  });
})();
</script>
